<style>
:root{
  --ink:#14283C; --steel:#5B6B7A; --bg:#EEF1F4; --card:#FFFFFF;
  --accent:#F2A900; --accent-ink:#2A1F00; --line:#D3DAE1;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Cairo',system-ui,'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.8;font-size:17px}
h1,h2,h3{line-height:1.3;font-weight:900}
a{color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

header{background:var(--ink);color:#fff;position:sticky;top:0;z-index:10}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:68px;gap:16px}
.logo{font-weight:900;font-size:24px;text-decoration:none}
.right{display:flex;align-items:center;gap:24px}
nav{display:flex;gap:24px}
nav a{text-decoration:none;font-weight:500;opacity:.85}
nav a:hover{opacity:1;text-decoration:underline}
#langBtn{background:transparent;border:2px solid var(--accent);color:var(--accent);padding:4px 16px;border-radius:6px;font-family:inherit;font-weight:700;font-size:16px;cursor:pointer}
#langBtn:hover{background:var(--accent);color:var(--accent-ink)}

.btn{display:inline-block;padding:12px 26px;border-radius:6px;font-weight:700;text-decoration:none;border:2px solid transparent;font-family:inherit}
.btn-main{background:var(--accent);color:var(--accent-ink)}
.btn-main:hover{background:#ffbd1f}
.btn-alt{border-color:#fff;color:#fff}
.btn-alt:hover{background:rgba(255,255,255,.12)}

.hero{background:var(--ink);color:#fff;padding:72px 0 84px;border-bottom:8px solid var(--accent)}
.hero h1{font-size:clamp(36px,7vw,64px);max-width:16ch}
.hero p{max-width:48ch;margin:20px 0 32px;font-size:19px;opacity:.9}
.hero .btns{display:flex;gap:14px;flex-wrap:wrap}

section{padding:64px 0}
section h2{font-size:clamp(28px,5vw,40px);margin-bottom:8px}
.lead{color:var(--steel);margin-bottom:32px;max-width:55ch}

.services{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.service{background:var(--card);border-inline-start:6px solid var(--accent);padding:22px;border-radius:4px}
.service h3{font-size:21px;margin-bottom:6px}
.service p{color:var(--steel);font-size:16px}
.price{display:block;margin-top:10px;font-weight:700}

.about{background:var(--card)}
.points{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:28px;margin-top:8px}
.points h3{font-size:20px;margin-bottom:4px}
.points p{color:var(--steel);font-size:16px}

.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:32px}
.contact dl{display:grid;gap:14px}
.contact dt{font-weight:500;color:var(--steel);font-size:15px}
.contact dd{font-size:18px}
.map iframe{width:100%;height:100%;min-height:300px;border:0;border-radius:6px;background:var(--line)}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.row .btn-alt{border-color:var(--ink);color:var(--ink)}
.row .btn-alt:hover{background:rgba(20,40,60,.08)}

footer{background:var(--ink);color:#fff;text-align:center;padding:24px 0;font-size:15px}

@media (max-width:720px){
  nav{display:none}
  .contact-grid{grid-template-columns:1fr}
  .hero{padding:48px 0 56px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>

var PHONE = "966500104594"; /* WhatsApp number: 966 + number without the first 0 */

function setLang(l){
  var d = T[l];
  document.documentElement.lang = l;
  document.documentElement.dir = (l === "ar") ? "rtl" : "ltr";
  document.querySelectorAll("[data-i18n]").forEach(function(el){
    el.textContent = d[el.getAttribute("data-i18n")];
  });
  document.querySelectorAll("[data-wa]").forEach(function(el){
    el.href = "https://wa.me/" + PHONE + "?text=" + encodeURIComponent(d.wa_msg);
  });
  document.getElementById("langBtn").textContent = d.btn;
  document.getElementById("mapFrame").title = d.map_title;
  document.title = d.title;
  try { localStorage.setItem("lang", l); } catch(e) {}
}

document.getElementById("langBtn").addEventListener("click", function(){
  setLang(document.documentElement.lang === "ar" ? "en" : "ar");
});

var saved = "ar";

setLang(saved === "en" ? "en" : "ar");
